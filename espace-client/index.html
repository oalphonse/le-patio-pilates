<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon espace · Le Patio</title>
<meta name="description" content="Votre espace client du studio Le Patio à Senlis : réservations, séances et abonnements.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../logo/icone-le-patio.png">
<link rel="apple-touch-icon" href="../logo/icone-le-patio.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap">
<style>
:root{
  --cream:#F9F7F1; --paper:#FDFCF9; --sand:#EBE6DC; --tan:#C2B88F; --tan-2:#DBD1A8; --khaki:#9E9466;
  --olive-l:#7A6B2A; --olive:#5E530E; --olive-d:#453D0A; --ink:#222222; --brown:#574325; --muted:#8B7B60;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --r:16px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
html,body{overflow-x:clip}
body{margin:0;background:var(--cream);color:var(--ink);font:400 16px/1.55 var(--font);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3{font-weight:400;letter-spacing:-.015em;margin:0;text-wrap:balance}
p{margin:0}
.wrap{max-width:1248px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.wrap > *{min-width:0}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--olive)}
.btn{display:inline-flex;align-items:center;justify-content:center;height:48px;padding:0 28px;border-radius:999px;font:500 15px/1 var(--font);text-decoration:none;transition:transform .15s;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
a:focus-visible{outline:2px solid var(--olive);outline-offset:3px}
.btn-light{background:var(--paper);color:var(--olive-d)}
.btn-olive{background:var(--olive);color:var(--paper)}
.btn-line{border:1.5px solid rgba(253,252,249,.7);color:var(--paper)}
.num{font-variant-numeric:tabular-nums}

/* En-tête */
.site-header{position:sticky;top:0;z-index:50;background:var(--olive);color:var(--paper)}
.site-header .wrap{display:flex;align-items:center;justify-content:space-between;gap:24px;height:87px;max-width:1440px}
.logo{display:block;position:relative;overflow:hidden;width:calc(310px * var(--ls));height:calc(275px * var(--ls));--ls:.28;flex:none}
.logo img{position:absolute;max-width:none;height:auto;width:calc(500px * var(--ls));left:calc(-95px * var(--ls));top:calc(-85px * var(--ls))}
.head-r{display:flex;align-items:center;gap:24px}
.back{font-size:14.5px;text-decoration:none;opacity:.9}
.back:hover{text-decoration:underline;text-underline-offset:5px}


/* Mon espace (page de test du widget espace client) */
.espace{background:var(--sand);min-height:calc(100vh - 87px - 80px)}
.espace .wrap{display:grid;gap:14px;padding-block:28px 40px;max-width:1040px}
.espace h1{font-size:clamp(34px,4.2vw,54px);line-height:1.08}
.espace .intro{font-size:17px;color:var(--brown);max-width:620px}
.espace-widget{margin-top:22px;min-height:240px;min-width:0}
@media (max-width:640px){.espace .wrap{padding-block:20px 28px}}
.btn-outline{border:1.5px solid var(--olive);color:var(--olive)}
footer{background:var(--olive);color:var(--sand);font-size:13.5px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:28px}
footer a{text-decoration:none}
@media (max-width:640px){
  .wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .site-header .wrap{height:72px}
  .logo{--ls:.24}
  .site-header .btn{height:42px;padding:0 18px}
}
/* Menu (identique à l'accueil) */
.nav{display:flex;gap:30px;font-size:15px}
.nav a{text-decoration:none;opacity:.92;white-space:nowrap}
.nav a:hover,.nav a[aria-current="page"]{opacity:1;text-decoration:underline;text-underline-offset:6px}
.burger{display:none;background:none;border:0;color:var(--paper);font:500 15px var(--font);cursor:pointer}
@media (max-width:1180px){
  .nav{display:none}
  .burger{display:block}
  .site-header.open .nav{display:flex;flex-direction:column;gap:14px;position:absolute;top:100%;left:0;right:0;background:var(--olive);padding:20px 24px 28px}
}

/* Logo du menu (version horizontale) */
.logo{width:auto;height:auto;overflow:visible;position:static;line-height:0}
.logo img{position:static;height:66px;width:auto;max-width:none}
@media (max-width:640px){.logo img{height:52px}}

/* Mobile et tablette : zones tactiles ≥ 44 px. Sans effet au-dessus de 980 px. */
@media (max-width:980px){footer a{padding-block:12px;margin-block:-12px}}
</style>
<link rel="stylesheet" href="../commun/entete.css">
<!-- Langue des widgets et fenêtres bsport = langue de la page (avant tout chargement de bsport) -->
<script src="../commun/bsport-langue.js"></script>
<link rel="stylesheet" href="../commun/bsport.css">
<link rel="stylesheet" href="../commun/bsport-espace-client.css">
<!-- Widgets bsport : chargement du script et fonction de montage, appelée après chaque bloc widget -->
<script id="insert-bsport-widget-cdn">!function (b, s, p) { typeof window.BsportWidget === "undefined" && !document.getElementById("bsport-widget-cdn") && !function () { var m = b.createElement(s); m.id = "bsport-widget-cdn"; m.src = p; b.getElementsByTagName("head")[0].appendChild(m) }() }(document, "script", "https://cdn.bsport.io/scripts/widget.js")</script>
<script>
function MountBsportWidget(config, repeat = 1) {
  if (repeat > 50) { return }
  if (!window.BsportWidget) { return setTimeout(() => { MountBsportWidget(config, repeat + 1) }, 100 * repeat || 1) }
  BsportWidget.mount(config)
}
</script>
</head>
<body>

<header class="site-header">
  <div class="wrap entete">
    <div class="head-gauche">
      <div class="menu-zone">
        <button class="menu-btn" id="menu-btn" type="button" aria-expanded="false" aria-controls="menu" data-num="B02"><span class="menu-ico" aria-hidden="true"></span><span class="menu-txt">Menu</span></button>
        <nav class="menu-panel" id="menu" aria-label="Menu"><a href="../#les-cours" data-num="L01">Les cours</a><a href="../#le-studio" data-num="L02">Le studio</a><a href="../#infos-pratiques" data-num="L06">Infos pratiques</a><a href="../#questions-frequentes" data-num="L07">FAQ</a><a href="../contact/" data-num="L08">Contact</a></nav>
      </div>
      <nav class="nav-rapide" aria-label="Accès rapide"><a href="../tarifs/" data-num="L03">Tarifs</a><a href="../planning/" data-num="L04">Planning</a><a href="../premiere-seance/" data-num="L05">Première séance</a></nav>
    </div>
    <a href="../" class="logo" data-num="I01"><img src="../logo/logo-le-patio-menu.png" alt="Le Patio" width="500" height="229"></a>
    <div class="head-droite">
      <a class="langue" href="../en/" hreflang="en" lang="en" aria-label="English version" data-num="L00">EN</a>
      <span class="fab-place" data-num="B00"><a class="compte" href="https://backoffice.bsport.io/login?membership=7023&amp;next=%2Fc%2F7023%2Fbooking%2F" aria-label="Mon compte" title="Mon compte"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></a></span>
      <a href="../planning/" class="btn btn-light" data-num="B01">Réserver</a>
    </div>
  </div>
</header>

<main>
  <section class="espace" aria-label="Mon espace" data-num="S01">
    <div class="wrap">
      <div class="eyebrow" data-num="T01">Mon espace</div>
      <h1 data-num="T02">Vos séances, au même endroit.</h1>
      <p class="intro" data-num="T03">Connectez-vous pour retrouver vos réservations, vos forfaits et votre abonnement.</p>
      <div id="bsport-widget-espace-client" class="bsport-widget espace-widget" data-num="C01"></div>
      <script>
      MountBsportWidget({
        "parentElement": "bsport-widget-espace-client",
        "companyId": 7023, "franchiseId": null, "dialogMode": 1,
        "widgetType": "consumerSpace", "showFab": false, "fullScreenPopup": false, "styles": undefined,
        "config": { "consumerSpace": {
          "defaultPage": "consumerBooking", "hideNavigation": false,
          "showTitle": true, "loginTitle": "Votre compte",
          "showSubtitle": true, "loginSubtitle": "Inscrivez-vous ou connectez-vous pour réserver et suivre vos séances."
        } }
      })
      </script>
    </div>
  </section>
</main>

<footer data-num="S02">
  <div class="wrap"><span data-num="T04">© Le Patio Pilates Club · Senlis</span><a href="../" data-num="L09">Retour à l'accueil</a></div>
</footer>
<script src="../commun/entete.js"></script>
<!-- Outil interne : numéros des éléments, à retirer à la mise en ligne -->
<script src="../outils/numeros.js"></script>
</body>
</html>
