<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact · Le Patio Pilates Club, studio de Pilates Reformer à Senlis</title>
<meta name="description" content="Contactez Le Patio Pilates Club, studio de Pilates Reformer à Senlis : téléphone et formulaire de contact pour toute question sur la première séance, les abonnements ou les forfaits.">
<link rel="icon" type="image/png" href="../logo/icone-le-patio.png">
<link rel="apple-touch-icon" href="../logo/icone-le-patio.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap">
<style>
:root{
  --cream:#F9F7F1; --paper:#FDFCF9; --sand:#EBE6DC; --tan:#C2B88F; --tan-2:#DBD1A8; --khaki:#9E9466;
  --olive-l:#7A6B2A; --olive:#5E530E; --olive-d:#453D0A; --ink:#222222; --brown:#574325; --muted:#8B7B60;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --r:16px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
html,body{overflow-x:clip}
body{margin:0;background:var(--cream);color:var(--ink);font:400 16px/1.55 var(--font);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3{font-weight:400;letter-spacing:-.015em;margin:0;text-wrap:balance}
p{margin:0}
.wrap{max-width:1248px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.wrap > *{min-width:0}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--olive)}
.btn{display:inline-flex;align-items:center;justify-content:center;height:48px;padding:0 28px;border-radius:999px;font:500 15px/1 var(--font);text-decoration:none;transition:transform .15s;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
a:focus-visible{outline:2px solid var(--olive);outline-offset:3px}
.btn-light{background:var(--paper);color:var(--olive-d)}
.btn-olive{background:var(--olive);color:var(--paper)}
.btn-line{border:1.5px solid rgba(253,252,249,.7);color:var(--paper)}
.num{font-variant-numeric:tabular-nums}

/* En-tête */
.site-header{position:sticky;top:0;z-index:50;background:var(--olive);color:var(--paper)}
.site-header .wrap{display:flex;align-items:center;justify-content:space-between;gap:24px;height:87px;max-width:1440px}
.logo{display:block;position:relative;overflow:hidden;width:calc(310px * var(--ls));height:calc(275px * var(--ls));--ls:.28;flex:none}
.logo img{position:absolute;max-width:none;height:auto;width:calc(500px * var(--ls));left:calc(-95px * var(--ls));top:calc(-85px * var(--ls))}
.head-r{display:flex;align-items:center;gap:24px}
.back{font-size:14.5px;text-decoration:none;opacity:.9}
.back:hover{text-decoration:underline;text-underline-offset:5px}

/* Introduction */
.intro{background:var(--sand)}
.intro .wrap{display:grid;gap:14px;padding-block:88px 56px}
.intro h1{font-size:clamp(36px,4.6vw,62px);line-height:1.08;max-width:820px}
.intro p{font-size:18px;color:var(--brown);max-width:620px;margin-top:6px}

/* Première séance mise en avant */
.offre-ps{background:var(--sand)}
.offre-ps .wrap{padding-block:0 72px}
.offre-ps-card{background:var(--olive);color:var(--paper);border-radius:22px;display:grid;grid-template-columns:auto 1fr auto;gap:48px;align-items:center;padding:40px 48px}
.offre-ps-card .eyebrow{color:var(--tan-2)}
.offre-ps-price{font-size:clamp(56px,6vw,84px);font-weight:300;line-height:1}
.offre-ps-card h2{font-size:26px;margin:6px 0 6px}
.offre-ps-card p{color:var(--sand)}

/* Formules */
.formules .wrap{display:grid;gap:56px;padding-block:88px}
.block{display:grid;grid-template-columns:280px 1fr;gap:48px;align-items:start}
.block-head{display:grid;gap:10px;position:sticky;top:110px}
.block-head h2{font-size:32px;line-height:1.15}
.block-head p{color:var(--brown);font-size:15px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.card{background:var(--paper);border:1px solid var(--sand);border-radius:var(--r);padding:30px 32px;display:grid;gap:10px;align-content:start}
.card .eyebrow{font-size:11.5px}
.price{font-size:clamp(34px,3.2vw,46px);font-weight:300;line-height:1.1;white-space:nowrap}
.card p{font-size:15px;color:var(--brown)}
.card .small{font-size:12.5px;color:var(--muted)}
.ftable{display:grid;gap:0;font-size:16px;margin-top:4px}
.ftable div{display:grid;grid-template-columns:1fr auto auto;gap:16px;padding:11px 0;border-bottom:1px solid var(--sand)}
.ftable div:last-child{border-bottom:0}
.ftable span:first-child{color:var(--brown)}
.ftable span:nth-child(2){font-weight:500}
.ftable span:last-child{color:var(--muted);min-width:96px;text-align:right}
.ftable .best span:last-child{color:var(--olive);font-weight:600}
.badge{justify-self:start;background:var(--olive);color:var(--paper);font-size:11px;font-weight:600;letter-spacing:.04em;padding:5px 12px;border-radius:999px}
.pill{justify-self:start;background:var(--sand);color:var(--olive-d);font-size:13px;font-weight:500;padding:7px 14px;border-radius:999px;margin-top:4px}
.card.incl{grid-column:1/-1;background:var(--olive);border-color:var(--olive);color:var(--paper)}
.card.incl .eyebrow{color:var(--tan-2)}
.card.incl ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;font-size:16px}
.card.incl li{display:flex;gap:10px}
.card.incl li::before{content:"✓";color:var(--tan-2)}

/* Conditions */
.cond{background:var(--paper);border-top:1px solid var(--sand)}
.cond .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;padding-block:56px}
.cond div{display:grid;gap:6px;align-content:start}
.cond b{font-weight:500}
.cond p{font-size:14.5px;color:var(--brown)}

/* Fin */
.end{background:var(--olive-d);color:var(--paper);text-align:center}
.end .wrap{display:grid;justify-items:center;gap:18px;padding-block:80px}
.end h2{font-size:clamp(28px,3.4vw,42px)}
.end p{color:var(--tan-2)}
.cta-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
footer{background:var(--olive);color:var(--sand);font-size:13.5px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:28px}
footer a{text-decoration:none}

@media (max-width:1180px){
  .block{grid-template-columns:1fr;gap:24px}
  .block-head{position:static}
}
@media (max-width:1000px){
  .block{grid-template-columns:1fr;gap:24px}
  .block-head{position:static}
  .offre-ps-card{grid-template-columns:1fr;gap:20px;padding:32px 28px}
  .cond .wrap{grid-template-columns:1fr 1fr}
  .back{display:none}
}
@media (max-width:640px){
  .wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .site-header .wrap{height:72px}
  .logo{--ls:.24}
  .site-header .btn{height:42px;padding:0 18px}
  .cards{grid-template-columns:1fr}
  .card{padding:24px 22px}
  .card.incl ul{grid-template-columns:1fr}
  .cond .wrap{grid-template-columns:1fr}
  .ftable span:last-child{min-width:0}
}

/* Menu (identique à l'accueil) */
.nav{display:flex;gap:30px;font-size:15px}
.nav a{text-decoration:none;opacity:.92;white-space:nowrap}
.nav a:hover,.nav a[aria-current="page"]{opacity:1;text-decoration:underline;text-underline-offset:6px}
.burger{display:none;background:none;border:0;color:var(--paper);font:500 15px var(--font);cursor:pointer}
@media (max-width:1180px){
  .nav{display:none}
  .burger{display:block}
  .site-header.open .nav{display:flex;flex-direction:column;gap:14px;position:absolute;top:100%;left:0;right:0;background:var(--olive);padding:20px 24px 28px}
}

/* Application (copie de l'accueil) */
.h2{font-size:clamp(30px,3.4vw,44px);line-height:1.15}
.app{background:var(--sand)}
.app .wrap{display:grid;grid-template-columns:1fr 300px;gap:48px;align-items:center;padding-block:52px 48px}
.app-txt{display:grid;gap:18px;max-width:520px}
.app-txt > p{color:var(--brown);font-size:17px}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:12px;font-size:16px}
.checks li{display:flex;gap:12px;align-items:center}
.checks li::before{content:"✓";flex:none;width:24px;height:24px;border-radius:50%;background:var(--olive);color:var(--paper);font-size:11px;display:grid;place-items:center}
.stores{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.store{background:var(--ink);color:#fff;border-radius:8px;padding:8px 18px 8px 22px;text-decoration:none;line-height:1.1}
.store small{display:block;font-size:9px;opacity:.75}
.store b{font-size:18px;font-weight:600}
.app-note{font-size:12.5px;color:var(--brown)}
.phone{width:300px;height:520px;border:12px solid var(--ink);border-radius:44px;background:var(--cream);padding:22px 18px;display:grid;align-content:start;gap:12px;font-size:13px}
.phone .t{font-size:11px;font-weight:600}
.phone h4{margin:6px 0 0;font-weight:400;font-size:22px;color:var(--olive)}
.phone .next{background:var(--olive);color:var(--paper);border-radius:12px;padding:14px;display:grid;gap:4px}
.phone .next small{font-size:9px;font-weight:600;letter-spacing:.05em;opacity:.8}
.phone .next b{font-weight:400;font-size:20px}
.phone .pill{justify-self:start;background:var(--paper);color:var(--olive-d);border-radius:999px;padding:4px 12px;font-size:11px;font-weight:600;margin-top:4px}
.phone .row{display:flex;justify-content:space-between;background:var(--paper);border-radius:8px;padding:10px 12px}
.phone .row b{color:var(--olive);font-weight:600;font-size:12px}
.phone .row{border:0}
.phone .row b,.phone .row span{font-size:12px}
@media (max-width:980px){.app .wrap{grid-template-columns:1fr}.phone{justify-self:center}}
@media (max-width:640px){.phone{width:min(300px,100%)}}

/* Logo du menu (version horizontale) */
.logo{width:auto;height:auto;overflow:visible;position:static;line-height:0}
.logo img{position:static;height:66px;width:auto;max-width:none}
@media (max-width:640px){.logo img{height:52px}}
/* Contact (repris de l'accueil) */
.contact{background:var(--sand)}
.contact .wrap{display:grid;grid-template-columns:1fr 1.25fr;gap:80px;align-items:center;padding-block:96px}
.contact-txt{display:grid;gap:18px}
.contact-txt > p{color:var(--brown);font-size:17px}
.contact-txt hr{border:0;border-top:1px solid var(--tan-2);margin:4px 0;width:85%}
.contact-txt .tel{font-size:26px}
form.cform{background:var(--cream);border-radius:22px;padding:40px;display:grid;grid-template-columns:1fr 1fr;gap:18px 16px}
form.cform h3{grid-column:1/-1;font-size:26px}
.field{display:grid;gap:8px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:14px;font-weight:500}
.field input,.field select,.field textarea{font:15px var(--font);color:var(--ink);background:var(--paper);border:1.5px solid var(--tan-2);border-radius:10px;padding:13px 16px;width:100%}
.field textarea{min-height:140px;resize:vertical}
.consent{grid-column:1/-1;display:flex;gap:10px;align-items:center;font-size:13px;color:var(--brown)}
.consent input{width:18px;height:18px;accent-color:var(--olive)}
form.cform .btn{grid-column:1/-1;justify-self:start}
.form-ok{grid-column:1/-1;font-size:14px;color:var(--olive)}
@media (max-width:1000px){.contact .wrap{grid-template-columns:1fr;gap:40px}}
@media (max-width:640px){.contact .wrap{padding-block:64px}form.cform{grid-template-columns:1fr;padding:26px 20px}}
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="../" class="logo"><img src="../logo/logo-le-patio-menu.png" alt="Le Patio" width="500" height="229"></a>
    <nav class="nav" id="menu" aria-label="Navigation principale"><a href="../premiere-seance/">Première séance</a><a href="../#le-studio">Le studio</a><a href="../#les-cours">Les cours</a><a href="../planning/">Planning</a><a href="../#infos-pratiques">Infos pratiques</a><a href="../#questions-frequentes">FAQ</a><a href="../tarifs/">Tarifs</a><a href="../contact/" aria-current="page">Contact</a></nav>
    <div class="head-r">
      <a href="../planning/" class="btn btn-light">Réserver</a>
      <button class="burger" id="burger" type="button" aria-expanded="false" aria-controls="menu">Menu</button>
    </div>
  </div>
</header>

<main>
<section class="contact" id="contact">
  <div class="wrap">
    <div class="contact-txt">
      <div class="eyebrow">Contact</div>
      <h1 class="h2">Une autre question ?<br>Parlons-en.</h1>
      <p>Appelez-nous ou écrivez-nous via le formulaire ci-contre.</p>
      <hr>
      <div class="eyebrow">Téléphone</div>
      <p class="tel">[Numéro à venir]</p>
    </div>
    <form class="cform" id="cform" novalidate data-tag="hors" data-label="Formulaire de contact" data-st="svg">
      <h3>Écrivez-nous</h3>
      <div class="field"><label for="c-nom">Nom et prénom</label><input id="c-nom" name="nom" placeholder="Camille Martin" required></div>
      <div class="field"><label for="c-mail">E-mail</label><input id="c-mail" name="email" type="email" placeholder="vous@exemple.fr" required></div>
      <div class="field full"><label for="c-objet">Objet</label>
        <select id="c-objet" name="objet"><option value="">Choisissez un sujet : première séance, abonnement, autre…</option><option>Première séance</option><option>Abonnement</option><option>Forfait</option><option>Autre</option></select></div>
      <div class="field full"><label for="c-msg">Message</label><textarea id="c-msg" name="message" placeholder="Votre message…"></textarea></div>
      <label class="consent"><input type="checkbox" id="c-ok" required> J'accepte que mes données soient utilisées pour répondre à ma demande.</label>
      <button class="btn btn-olive" type="submit">Envoyer le message</button>
      <p class="form-ok" id="form-ok" hidden></p>
    </form>
  </div>
</section>
</main>

<footer>
  <div class="wrap"><span>© Le Patio Pilates Club · Senlis</span><a href="../">Retour à l'accueil</a></div>
</footer>
<script>
document.getElementById('cform').addEventListener('submit',e=>{
  e.preventDefault();const ok=document.getElementById('form-ok');
  const f=e.currentTarget;
  if(!f.querySelector('#c-nom').value||!f.querySelector('#c-mail').validity.valid||!f.querySelector('#c-ok').checked){ok.hidden=false;ok.textContent="Renseignez votre nom, un e-mail valide et cochez la case de consentement.";return;}
  ok.hidden=false;ok.textContent="Merci, votre message est prêt. L'envoi sera branché à la mise en ligne.";
});
document.getElementById('burger').addEventListener('click',e=>{const h=document.querySelector('.site-header');const o=h.classList.toggle('open');e.currentTarget.setAttribute('aria-expanded',o);});
</script>
</body>
</html>
